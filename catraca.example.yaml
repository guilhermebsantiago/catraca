# Catraca server configuration. Copy it to catraca.yaml and adjust.
#
# Every field is documented in docs/config.md. Fields left out take their
# defaults, unknown fields are errors, and `catraca config check` validates
# the file (and the ruleset it points at) without starting the server.
#
# Values may read environment variables: ${NAME} fails when NAME is not set,
# ${NAME:-default} falls back to default when NAME is unset or empty, and
# $${ is a literal ${. Keep every secret in the environment, not here.
#
# Relative paths are resolved against the directory of this file.

server:
  # host:port to listen on. Put Catraca behind TLS (a load balancer or a
  # reverse proxy) when it is reachable from outside the platform's network.
  listen: ${CATRACA_LISTEN:-:8080}
  # Serve /healthz, /readyz and /metrics, which take no token, on a port of
  # their own that the load balancer does not expose. Left out, the listen
  # address serves them.
  # admin_addr: :9090
  # Largest JSON body accepted on the /v1 routes, in bytes.
  max_body_bytes: 1048576
  # On SIGTERM, keep serving this long while /readyz reports not ready, so
  # load balancers stop sending requests first. 0s for one instance with no
  # load balancer in front.
  drain_delay: 5s
  # Then, how long a graceful shutdown may take: finishing requests and
  # leaked-key batches and writing queued decisions to the audit log.
  shutdown_timeout: 30s
  # Decisions in flight at once on /v1/decide and /v1/events (and, apart,
  # feedback requests). A request over the limit waits up to inflight_wait,
  # then is shed: decided at once without the store, degraded, or for
  # feedback and key_leak events, answered 503 with Retry-After. adaptive
  # lowers the limit while decisions take half of engine.deadline or more;
  # static keeps it at max_inflight.
  max_inflight: 256
  inflight_wait: 2ms
  inflight_limit: adaptive

auth:
  # Bearer tokens for the /v1 routes (feedback and secret scanning
  # authenticate by signature instead). Give each client its own token,
  # with only the scopes it needs: decide (POST /v1/decide and /v1/events),
  # read (decisions, the review queue, stats, rules), label, admin (rules
  # reload). The send path's token is on every app server, so it gets
  # decide alone. A token without scopes has them all (docs/api.md). To
  # rotate one, make the new one token and the old one a previous token,
  # move the client, then remove the old one (docs/rotation.md).
  tokens:
    - name: send-path
      token: ${CATRACA_API_TOKEN}
      # previous_tokens: ["${CATRACA_API_TOKEN_OLD}"]
      scopes: [decide]
    # Reviewers, dashboards and deploy tooling.
    - name: ops
      token: ${CATRACA_OPS_TOKEN}
      scopes: [decide, read, label, admin]

rules:
  # The ruleset, kept in git.
  path: rules/default.yaml
  # The file is read this often and loaded when its content changed, so an
  # edit or a Kubernetes ConfigMap update reaches every instance; 0s turns
  # the watch off. POST /v1/rules/reload and, on Unix, SIGHUP reload it too.
  watch_interval: 5s

store:
  # memory keeps counters in the process: fine for one instance, lost on
  # restart. redis shares them between instances.
  backend: memory
  # backend: redis
  # redis:
  #   # redis://:password@localhost:6379/0, with connection options as
  #   # query parameters: ?pool_size=50&read_timeout=1s&dial_timeout=2s
  #   url: ${CATRACA_REDIS_URL}
  #   # standalone, sentinel (the URL names the sentinels and adds
  #   # master_name=...) or cluster (the URL names some of the nodes).
  #   mode: standalone
  #   prefix: "catraca:"
  # With a maxmemory limit, run Redis with maxmemory-policy volatile-ttl
  # (docs/config.md explains why).

audit:
  # The decision log: sqlite:<path> (or a plain path) for one instance,
  # postgres://... for several.
  dsn: ${CATRACA_AUDIT_DSN:-sqlite:catraca.db}
  # minimal keeps no message content; full also keeps the whole event.
  event_detail: minimal
  # The log holds personal data in both modes: account and key ids, client
  # IPs, sender and recipient domains, reviewers' names; with full, also
  # addresses, subjects and links. Left out, retention keeps it all forever:
  # set one your privacy policy allows (docs/audit.md, "Personal data").
  # Delete decisions without a label, and webhook deliveries once delivered
  # or dead, after this long (at least 24h). Left out, nothing is deleted.
  # retention: 2160h          # 90 days; shorter, such as 720h, with full
  # Labeled decisions are kept forever, for the precision gate, unless this
  # is set; it must be at least retention.
  # labeled_retention: 17520h # 2 years
  # Rows one retention DELETE removes, and the wait after each. Defaults:
  # 500 and as long as the DELETE took on SQLite, 5000 and 10ms on Postgres.
  # retention_batch: 5000
  # retention_pause: 10ms
  # Decisions waiting to be written (about 1 KB each), and the most written
  # per transaction. When the buffer is full new decisions are dropped:
  # size it as decisions recorded per second times the stall to ride out.
  buffer_size: 8192
  batch_size: 256
  # Share of plain allows (no rule matched, enforced or shadow, every
  # signal present) to record; every other decision is always recorded.
  # sample_allowed: 0.1
  # Connections to the database from this process. With Postgres, keep
  # max_open_conns times the number of instances under max_connections.
  max_open_conns: 10
  # max_idle_conns: 10        # defaults to max_open_conns
  conn_max_lifetime: 30m
  conn_max_idle_time: 5m

engine:
  # Time budget for the signal lookup of one decision. When it runs out the
  # decision is made without the missing signals and marked degraded.
  deadline: 10ms
  # How long a decision with effects waits for them to be written to the
  # outbox before it is answered; the write goes on in the background.
  # Defaults to deadline.
  # dispatch_timeout: 10ms
  # How far an event's time may be from Catraca's clock. A time further
  # ahead is replaced by the clock's; an event older than max_event_age is
  # rejected (168h is the longest counter window).
  max_future_skew: 5s
  max_event_age: 168h
  # How long the id of an event that counted is remembered, so the event sent
  # again meanwhile (a retry, a provider's redelivery) counts once. Each event
  # with an id costs a store entry for this long; 0s turns it off.
  dedupe_ttl: 10m
  # How long an address that hard-bounced or complained is remembered, for
  # every account (event.suppressed_recipients); 0s turns it off. The store
  # keeps an HMAC of each address, keyed with recipient_hash_key.
  recipient_memory: 720h
  # recipient_hash_key: ${CATRACA_RECIPIENT_HASH_KEY}
  # Decisions waiting to be handed to the audit log, which holds them while
  # its database has not opened yet. Size it as decisions per second times
  # how long the database may take to open.
  record_queue: 4096
  # Event attributes counted as entities, read by rules as
  # entity.<name>.distinct_accounts_24h and the like (docs/signals.md).
  # Each one a send carries costs it eight more store operations.
  # entities:
  #   - name: content
  #     attribute: content_hash
  #   - name: parent
  #     attribute: parent_account
  # When store calls keep failing or missing the deadline for
  # failure_window, none succeeding, and at least failure_threshold of them,
  # decide without the store for cooldown, then let probes through to see
  # whether it is back.
  breaker:
    failure_threshold: 20
    failure_window: 500ms
    cooldown: 2s
    probes: 5

gate:
  # A rule may enforce once it has at least min_labeled labeled matches and
  # a Wilson 95% lower bound on precision of at least min_precision.
  min_labeled: 30
  min_precision: 0.9
  # A rule a ruleset load would make enforce, new in enforce mode or switched
  # from shadow and without an override, must pass the gate on the labels in
  # the audit database: enforce holds it in shadow mode until it does, warn
  # lets it enforce and logs it, off does not check.
  on_load: enforce

# Webhooks that carry out the effects of enforced rules, one per effect name.
# Each request is signed with the hook's secret (see docs/hooks.md). Until
# a hook is configured, its effect does not run: `catraca config check` and
# the server's log warn about it. Uncomment this one and point it at the
# platform's endpoint that revokes an API key.
# hooks:
#   - name: revoke_key
#     url: ${CATRACA_REVOKE_KEY_URL}
#     secret: ${CATRACA_HOOK_SECRET}
#     # While the secret is rotated, requests are signed with the old one too,
#     # so the receiver accepts them before it switches (docs/rotation.md).
#     # previous_secrets: ["${CATRACA_HOOK_SECRET_OLD}"]
#     timeout: 10s
#     # headers:
#     #   Authorization: Bearer ${PLATFORM_HOOK_TOKEN}
#     # Deliveries to this hook attempted at once, at most outbox.workers.
#     concurrency: 4
#     # A delivery is given up after max_attempts failed attempts, or once
#     # max_age has passed since it was queued, whichever comes first.
#     max_attempts: 15
#     max_age: 24h

# Delivery of the hooks: how many deliveries are attempted at once across
# every hook. Each hook takes at most its own concurrency of them, so one
# slow endpoint cannot hold up the others.
outbox:
  workers: 16

# Delivery feedback. A provider is enabled when its section is present.
feedback:
  # Amazon SES through SNS (docs/feedback.md).
  # ses:
  #   topic_arns:
  #     - arn:aws:sns:us-east-1:111122223333:catraca-ses-feedback
  #   account_tag: catraca-account
  #   account_header: X-Catraca-Account

  # useSend webhooks.
  # usesend:
  #   secret: ${USESEND_WEBHOOK_SECRET}

  # Catraca's own format, signed with a shared secret. Requests signed with
  # a previous secret are accepted while the platform switches.
  generic:
    secret: ${CATRACA_FEEDBACK_SECRET}
    # previous_secrets: ["${CATRACA_FEEDBACK_SECRET_OLD}"]

secret_scanning:
  # GitHub's secret scanning partner endpoint (docs/secret-scanning.md).
  github:
    enabled: false
    resolver:
      # The platform endpoint that says which API key a token is.
      url: https://platform.internal/internal/catraca/resolve-key
      secret: ${CATRACA_RESOLVER_SECRET:-}
      # previous_secrets: ["${CATRACA_RESOLVER_SECRET_OLD}"]
      # Send the raw token, not only its SHA-256. Needs an https URL.
      send_raw_token: false
    # Answer GitHub with true/false positive labels, once GitHub enables it.
    feedback: false
    # A GitHub token without scopes, to raise the rate limit on GitHub's
    # public keys endpoint.
    github_token: ${GITHUB_TOKEN:-}
    # Reports are stored in the audit database and retried with backoff
    # until they go through, or until either bound below is reached; then
    # they are dead until requeued with catraca secretscan retry.
    max_attempts: 1000
    max_age: 24h

logging:
  # debug, info, warn or error.
  level: info
  # json or text.
  format: json

# OpenTelemetry tracing over OTLP/HTTP (docs/tracing.md). Off, it costs
# nothing. Fields left out read the standard OTEL_* variables, such as
# OTEL_EXPORTER_OTLP_ENDPOINT and OTEL_EXPORTER_OTLP_HEADERS.
tracing:
  enabled: false
  # endpoint: http://otel-collector:4318
  # The share of traces kept among those that start here; a request whose
  # traceparent says its caller kept the trace is always traced.
  # sample_ratio: 0.1
  # service_name: catraca
