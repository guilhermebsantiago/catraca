name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly on main as well, so a vulnerability published for the pinned
  # toolchain or a dependency fails govulncheck without waiting for a commit.
  schedule:
    - cron: "27 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::Run gofmt -w on these files:"
            echo "$unformatted"
            exit 1
          fi
      - name: go mod tidy
        run: go mod tidy -diff
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...

  vuln:
    name: Vulnerabilities (govulncheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # setup-go installs the version on go.mod's toolchain line and sets
      # GOTOOLCHAIN=local, so every job builds with that patch release.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # govulncheck judges the standard library by the Go that runs it, so
      # check that this is the toolchain go.mod pins. The Docker build does
      # not read go.mod (the golang image sets GOTOOLCHAIN=local), so its
      # image tag must name the same release; Dependabot bumps that tag but
      # not the toolchain line, and this step makes the two move together.
      - name: Toolchain
        run: |
          want="$(go mod edit -json | jq -r '.Toolchain // ("go" + .Go)')"
          got="$(go env GOVERSION)"
          docker="$(sed -n 's/^FROM golang:\([0-9.]*\)-alpine@.*/go\1/p' Dockerfile)"
          echo "go.mod: $want, CI: $got, Dockerfile: $docker"
          if [ "$got" != "$want" ]; then
            echo "::error::CI runs $got but go.mod asks for $want"
            exit 1
          fi
          if [ "$docker" != "$want" ]; then
            echo "::error file=Dockerfile::the Dockerfile builds with ${docker:-an unpinned golang image}; go.mod asks for $want"
            exit 1
          fi
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  prometheus-rules:
    name: Prometheus rules (promtool)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Pinned, with the archive's SHA-256 from the release's
      # sha256sums.txt. Dependabot does not update it; CONTRIBUTING.md says
      # how.
      PROMETHEUS_VERSION: "3.15.0"
      PROMETHEUS_SHA256: 2a542df32eac02ee17b9d844fb2aa1de00dafa5476579ba8a3ba862e9d572ea0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install promtool
        run: |
          archive="prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/${archive}"
          echo "${PROMETHEUS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" --strip-components=1 "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          ./promtool --version
      # The recording and alerting rules of the SLOs (docs/slo.md): valid,
      # and doing what their unit tests say.
      - name: promtool check rules
        run: ./promtool check rules deploy/prometheus/rules.yaml
      - name: promtool test rules
        run: ./promtool test rules deploy/prometheus/rules.test.yaml
      - name: Grafana dashboard
        run: jq empty deploy/grafana/*.json

  helm:
    name: Helm chart (lint, template, kubeconform)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Pinned, with each archive's SHA-256 from the release's checksums
      # (get.helm.sh/<archive>.sha256sum, kubeconform's CHECKSUMS). Dependabot
      # does not update them.
      HELM_VERSION: "3.19.0"
      HELM_SHA256: a7f81ce08007091b86d8bd696eb4d86b8d0f2e1b9f6c714be62f82f96a594496
      KUBECONFORM_VERSION: "0.7.0"
      KUBECONFORM_SHA256: c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3
      # The Kubernetes release whose schemas the manifests are checked
      # against, and a commit of datreeio/CRDs-catalog for the Prometheus
      # Operator's ServiceMonitor and PrometheusRule.
      KUBERNETES_VERSION: "1.31.0"
      CRDS_CATALOG_COMMIT: 3eb90d47aba8d61919d4419dd38301536e32a94b
      CHART: deploy/helm/catraca
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install helm and kubeconform
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          archive="helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          curl -fsSL --retry 3 -o "$archive" "https://get.helm.sh/${archive}"
          echo "${HELM_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" --strip-components=1 linux-amd64/helm
          archive="kubeconform-linux-amd64.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/${archive}"
          echo "${KUBECONFORM_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" kubeconform
          rm -f helm-*.tar.gz kubeconform-*.tar.gz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Versions
        run: |
          helm version
          kubeconform -v
      # The chart carries copies of the starter ruleset and the Prometheus
      # rules, since a chart cannot read files outside its directory.
      - name: Chart copies in step
        run: |
          cmp rules/default.yaml "$CHART/files/rules.yaml"
          cmp deploy/prometheus/rules.yaml "$CHART/files/prometheus-rules.yaml"
      - name: helm lint
        run: |
          helm lint --strict "$CHART"
          helm lint --strict "$CHART" -f "$CHART/ci/production-values.yaml"
      - name: helm template
        run: |
          mkdir -p rendered
          helm template catraca "$CHART" > rendered/default.yaml
          helm template catraca "$CHART" -f "$CHART/ci/production-values.yaml" > rendered/production.yaml
          # Several pods without Redis and Postgres must refuse to render.
          if helm template catraca "$CHART" --set replicaCount=3 > /dev/null 2>&1; then
            echo "::error::the chart rendered 3 replicas with the memory store and SQLite"
            exit 1
          fi
      - name: kubeconform
        run: |
          kubeconform -strict -summary \
            -kubernetes-version "$KUBERNETES_VERSION" \
            -schema-location default \
            -schema-location "https://raw.githubusercontent.com/datreeio/CRDs-catalog/${CRDS_CATALOG_COMMIT}/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
            rendered/default.yaml rendered/production.yaml
      # The configuration the chart renders must be one the server accepts:
      # catraca config check, with the ruleset path pointed at the copy here.
      - name: catraca config check
        env:
          CATRACA_API_TOKEN: ci-token-0123456789abcdef
          CATRACA_OPS_TOKEN: ci-ops-0123456789abcdef
          CATRACA_FEEDBACK_SECRET: ci-feedback-0123456789abcdef
          CATRACA_AUDIT_DSN: postgres://catraca:catraca@localhost:5432/catraca?sslmode=disable
          CATRACA_REDIS_URL: redis://localhost:6379/0
          RULES: ${{ github.workspace }}/deploy/helm/catraca/files/rules.yaml
        run: |
          go build -o "$RUNNER_TEMP/catraca" ./cmd/catraca
          for values in default production; do
            echo "::group::$values"
            yq 'select(.kind == "ConfigMap" and .data["catraca.yaml"]) | .data["catraca.yaml"]' "rendered/$values.yaml" \
              | yq '.rules.path = strenv(RULES)' > "rendered/$values-config.yaml"
            "$RUNNER_TEMP/catraca" config check -config "rendered/$values-config.yaml"
            echo "::endgroup::"
          done

  test:
    name: Test (Linux, Redis, Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: catraca
          POSTGRES_PASSWORD: catraca
          POSTGRES_DB: catraca_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U catraca -d catraca_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CATRACA_TEST_POSTGRES_URL: postgres://catraca:catraca@localhost:5432/catraca_test?sslmode=disable
      CATRACA_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: |
          total="$(go tool cover -func=coverage.out | tail -n 1)"
          echo "$total"
          {
            echo '### Coverage'
            echo
            echo '```'
            echo "$total"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out
          retention-days: 14
          if-no-files-found: error

  faults:
    name: Fault injection (Linux, Redis, Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: catraca
          POSTGRES_PASSWORD: catraca
          POSTGRES_DB: catraca_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U catraca -d catraca_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CATRACA_TEST_FAULTS: "1"
      CATRACA_TEST_POSTGRES_URL: postgres://catraca:catraca@localhost:5432/catraca_test?sslmode=disable
      CATRACA_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The scenarios of docs/faults.md: the server with Redis and Postgres
      # behind a proxy that breaks them mid-run. Plain go test skips them,
      # since they take minutes; they run one at a time, since each counts
      # the process's goroutines.
      - name: Fault scenarios
        run: go test -race -count=1 -timeout 20m -run '^TestFault' -v ./internal/app/

  test-os:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Without CATRACA_TEST_REDIS_URL and CATRACA_TEST_POSTGRES_URL the
      # tests against real servers skip; the Linux job runs them.
      - name: go test
        run: go test ./...

  fuzz:
    name: Fuzz (${{ matrix.package }})
    strategy:
      fail-fast: false
      matrix:
        package:
          - internal/config
          - internal/event
          - internal/feedback
          - internal/rules
          - internal/secretscan
          - internal/store
          - signature
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PACKAGE: ${{ matrix.package }}
      # How long each fuzz target runs: briefly on pull requests and main,
      # longer on the weekly run and on demand. The test job already runs
      # every target's seeds and testdata/fuzz corpus as ordinary tests,
      # against real Redis too.
      FUZZTIME: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '5m' || '20s' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # go test -fuzz takes one target of one package at a time. A failing
      # input is written to the package's testdata/fuzz/<target>/; commit it
      # with the fix, as a regression seed.
      - name: Fuzz each target
        run: |
          targets="$(go test -list '^Fuzz' "./$PACKAGE" | grep '^Fuzz' || true)"
          if [ -z "$targets" ]; then
            echo "::error::no fuzz targets in $PACKAGE"
            exit 1
          fi
          for target in $targets; do
            echo "::group::$target ($FUZZTIME)"
            go test "./$PACKAGE" -run '^$' -fuzz "^$target\$" -fuzztime "$FUZZTIME" -fuzzminimizetime 30s
            echo "::endgroup::"
          done
      - name: Name the artifact
        if: failure()
        id: artifact
        run: echo "name=fuzz-${PACKAGE//\//-}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ matrix.package }}/testdata/fuzz
          retention-days: 14
          if-no-files-found: ignore

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Builds every package for each target and links the commands, such
      # as cmd/catraca, into dist/<os>-<arch>/.
      - name: Cross-compile
        env:
          CGO_ENABLED: "0"
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            echo "::group::$target"
            GOOS="$goos" GOARCH="$goarch" go build -trimpath -o "dist/$goos-$goarch/" ./...
            ls -l "dist/$goos-$goarch/" 2>/dev/null || true
            echo "::endgroup::"
          done

  docker:
    name: Docker image and compose
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CATRACA_API_TOKEN: ci-token-0123456789abcdef
      CATRACA_OPS_TOKEN: ci-ops-0123456789abcdef
      CATRACA_FEEDBACK_SECRET: ci-feedback-0123456789abcdef
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Runs the stack the README's quick start describes (Redis counters,
      # Postgres audit log) and asks it for a decision.
      - name: Compose up
        working-directory: deploy
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Decide
        run: |
          for _ in $(seq 1 30); do
            curl -fsS localhost:8080/readyz && break
            sleep 2
          done
          curl -fsS localhost:8080/v1/decide \
            -H "Authorization: Bearer $CATRACA_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"type":"send","account_id":"acc_ci","from":"hello@example.com","to":["someone@example.org"]}' \
            | tee decision.json
          grep -q '"action":"allow"' decision.json
      - name: Logs
        if: failure()
        working-directory: deploy
        run: docker compose logs
      - name: Compose down
        if: always()
        working-directory: deploy
        run: docker compose down --volumes

  release-dry-run:
    name: Release dry run (GoReleaser snapshot)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CATRACA_API_TOKEN: ci-token-0123456789abcdef
      CATRACA_OPS_TOKEN: ci-ops-0123456789abcdef
      CATRACA_FEEDBACK_SECRET: ci-feedback-0123456789abcdef
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser versions the snapshot from the tags and history.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Everything release.yml does except publishing, signing and attesting:
      # the builds with their ldflags, archives, SBOMs, checksums and both
      # platform images (loaded here, not pushed), so a broken release
      # configuration fails a pull request instead of a tag.
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.3
          args: release --snapshot --clean
      - name: Smoke test the image
        run: |
          image="$(jq -r '[.[] | select(.type == "Docker Image") | .name | select(endswith("-amd64"))][0] // empty' dist/artifacts.json)"
          if [ -z "$image" ]; then
            echo "::error::GoReleaser built no linux/amd64 image"
            exit 1
          fi
          # The binary carries the release version and the pinned toolchain.
          docker run --rm "$image" version | tee version.txt
          grep -q "^catraca v.* $(go env GOVERSION) linux/amd64$" version.txt
          # The baked-in configuration keeps the SQLite audit log under
          # /var/lib/catraca; the server only gets ready if nonroot can
          # write there.
          docker run --detach --name catraca -p 8080:8080 \
            -e CATRACA_API_TOKEN -e CATRACA_OPS_TOKEN -e CATRACA_FEEDBACK_SECRET "$image"
          for _ in $(seq 1 30); do
            curl -fsS localhost:8080/readyz && break
            sleep 1
          done
          curl -fsS localhost:8080/v1/decide \
            -H "Authorization: Bearer $CATRACA_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"type":"send","account_id":"acc_ci","from":"hello@example.com","to":["someone@example.org"]}' \
            | tee decision.json
          grep -q '"action":"allow"' decision.json
      - name: Logs
        if: failure()
        run: docker logs catraca || true

  examples-ts:
    name: TypeScript example ${{ matrix.example }} (Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        example: [client-ts, hono]
        node: [22, 24]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: examples/${{ matrix.example }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
