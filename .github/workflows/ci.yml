name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly on main as well, so a vulnerability published for the pinned
  # toolchain or a dependency fails govulncheck without waiting for a commit.
  schedule:
    - cron: "27 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::Run gofmt -w on these files:"
            echo "$unformatted"
            exit 1
          fi
      - name: go mod tidy
        run: go mod tidy -diff
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...

  vuln:
    name: Vulnerabilities (govulncheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # setup-go installs the version on go.mod's toolchain line and sets
      # GOTOOLCHAIN=local, so every job builds with that patch release.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # govulncheck judges the standard library by the Go that runs it, so
      # check that this is the toolchain go.mod pins. The Docker build does
      # not read go.mod (the golang image sets GOTOOLCHAIN=local), so its
      # image tag must name the same release; Dependabot bumps that tag but
      # not the toolchain line, and this step makes the two move together.
      - name: Toolchain
        run: |
          want="$(go mod edit -json | jq -r '.Toolchain // ("go" + .Go)')"
          got="$(go env GOVERSION)"
          docker="$(sed -n 's/^FROM golang:\([0-9.]*\)-alpine@.*/go\1/p' Dockerfile)"
          echo "go.mod: $want, CI: $got, Dockerfile: $docker"
          if [ "$got" != "$want" ]; then
            echo "::error::CI runs $got but go.mod asks for $want"
            exit 1
          fi
          if [ "$docker" != "$want" ]; then
            echo "::error file=Dockerfile::the Dockerfile builds with ${docker:-an unpinned golang image}; go.mod asks for $want"
            exit 1
          fi
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  test:
    name: Test (Linux, Redis, Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: catraca
          POSTGRES_PASSWORD: catraca
          POSTGRES_DB: catraca_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U catraca -d catraca_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CATRACA_TEST_POSTGRES_URL: postgres://catraca:catraca@localhost:5432/catraca_test?sslmode=disable
      CATRACA_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: |
          total="$(go tool cover -func=coverage.out | tail -n 1)"
          echo "$total"
          {
            echo '### Coverage'
            echo
            echo '```'
            echo "$total"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out
          retention-days: 14
          if-no-files-found: error

  test-os:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Without CATRACA_TEST_REDIS_URL and CATRACA_TEST_POSTGRES_URL the
      # tests against real servers skip; the Linux job runs them.
      - name: go test
        run: go test ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Builds every package for each target and links the commands, such
      # as cmd/catraca, into dist/<os>-<arch>/.
      - name: Cross-compile
        env:
          CGO_ENABLED: "0"
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            echo "::group::$target"
            GOOS="$goos" GOARCH="$goarch" go build -trimpath -o "dist/$goos-$goarch/" ./...
            ls -l "dist/$goos-$goarch/" 2>/dev/null || true
            echo "::endgroup::"
          done

  docker:
    name: Docker image and compose
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CATRACA_API_TOKEN: ci-token-0123456789abcdef
      CATRACA_FEEDBACK_SECRET: ci-feedback-0123456789abcdef
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Runs the stack the README's quick start describes (Redis counters,
      # Postgres audit log) and asks it for a decision.
      - name: Compose up
        working-directory: deploy
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Decide
        run: |
          for _ in $(seq 1 30); do
            curl -fsS localhost:8080/readyz && break
            sleep 2
          done
          curl -fsS localhost:8080/v1/decide \
            -H "Authorization: Bearer $CATRACA_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"type":"send","account_id":"acc_ci","from":"hello@example.com","to":["someone@example.org"]}' \
            | tee decision.json
          grep -q '"action":"allow"' decision.json
      - name: Logs
        if: failure()
        working-directory: deploy
        run: docker compose logs
      - name: Compose down
        if: always()
        working-directory: deploy
        run: docker compose down --volumes

  examples-ts:
    name: TypeScript example ${{ matrix.example }} (Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        example: [client-ts, hono]
        node: [22, 24]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: examples/${{ matrix.example }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
