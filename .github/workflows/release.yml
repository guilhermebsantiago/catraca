name: Release

# Pushing a v* tag builds the release with GoReleaser (.goreleaser.yaml):
# binaries for Linux, macOS and Windows on amd64 and arm64, checksums, SBOMs,
# and a signed multi-arch image on ghcr.io, then attests the build
# provenance of all of them. CONTRIBUTING.md ("Releasing") has the steps.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Never cancel a release half way through; a second tag waits its turn.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: GoReleaser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub release and upload its assets
      packages: write # push the image and its signature to ghcr.io
      id-token: write # OIDC identity for keyless cosign and the attestations
      attestations: write # store the provenance attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser needs the tags and history for the version and changelog.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # No module or build cache: a release builds from a clean slate
          # rather than from a cache another workflow run wrote.
          cache: false
      # The binaries are only as patched as the Go that builds them.
      - name: Toolchain
        run: |
          want="$(go mod edit -json | jq -r '.Toolchain // ("go" + .Go)')"
          got="$(go env GOVERSION)"
          echo "go.mod: $want, building with: $got"
          if [ "$got" != "$want" ]; then
            echo "::error::building with $got but go.mod asks for $want"
            exit 1
          fi
      # Installed before GoReleaser so goreleaser-action also verifies the
      # GoReleaser download against its Sigstore bundle, not only a checksum.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      # A docker-container builder, which pushes multi-platform images with
      # SBOM attestations. No QEMU: Dockerfile.release has no RUN step for
      # the target platform.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          # Pinned; keep in step with the version in .goreleaser.yaml's header.
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # One SLSA provenance attestation covering every file in checksums.txt:
      # the archives and their SBOMs.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      - name: Image digest
        id: image
        run: |
          digest="$(jq -r '[.[] | select(.type == "Docker Image") | .extra.Digest] | unique | .[]' dist/artifacts.json)"
          if [ "$(printf '%s\n' "$digest" | grep -c '^sha256:')" != 1 ]; then
            echo "::error::expected one image digest, got: $digest"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # The image provenance goes to the registry next to the image, where
      # gh attestation verify oci://... and policy controllers look for it.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/guilhermebsantiago/catraca
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          # Storage records exist only for organization-owned repositories.
          create-storage-record: false
