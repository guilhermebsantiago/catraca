# Configuration for compose.yaml: counters in Redis, so several instances
# share them, and the audit log in Postgres.
server:
  listen: :8080
  # No load balancer in front to drain from.
  drain_delay: 0s

auth:
  # The send path's token decides and nothing else; reading the audit log,
  # labeling and reloading the rules take the ops token (docs/api.md).
  tokens:
    - name: send-path
      token: ${CATRACA_API_TOKEN}
      scopes: [decide]
    - name: ops
      token: ${CATRACA_OPS_TOKEN}
      scopes: [decide, read, label, admin]

rules:
  path: rules/default.yaml

store:
  backend: redis
  redis:
    url: ${CATRACA_REDIS_URL:-redis://redis:6379/0}

audit:
  dsn: ${CATRACA_AUDIT_DSN:-postgres://catraca:catraca@postgres:5432/catraca?sslmode=disable}
  # Connections per instance: keep this times the number of instances under
  # Postgres's max_connections (100 by default).
  max_open_conns: 10
  # Delete unlabeled decisions and finished webhook deliveries after this
  # long; left out, nothing is deleted (docs/audit.md#retention).
  # retention: 2160h

feedback:
  generic:
    secret: ${CATRACA_FEEDBACK_SECRET}

logging:
  level: ${CATRACA_LOG_LEVEL:-info}
  format: json
