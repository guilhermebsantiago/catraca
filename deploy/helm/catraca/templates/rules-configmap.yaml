{{- if not .Values.rules.existingConfigMap }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "catraca.rulesConfigMapName" . }}
  labels:
    {{- include "catraca.labels" . | nindent 4 }}
    app.kubernetes.io/component: rules
data:
  # Each pod watches this file and reloads it when it changes, within
  # rules.watch_interval of the kubelet updating the mount (docs/config.md).
  {{ .Values.rules.key }}: |
    {{- default (.Files.Get "files/rules.yaml") .Values.rules.content | nindent 4 }}
{{- end }}
