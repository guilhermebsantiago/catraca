{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "catraca.serviceAccountName" . }}
  labels:
    {{- include "catraca.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Catraca does not call the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
