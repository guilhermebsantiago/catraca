# Configuration baked into the container image: one instance, counters in
# memory, the audit log in SQLite under /var/lib/catraca (mount a volume
# there). compose.yaml uses catraca.compose.yaml instead, with Redis and
# Postgres. Secrets come from the environment; see docs/config.md.
server:
  listen: ${CATRACA_LISTEN:-:8080}
  # Set to :9090, say, to serve /healthz, /readyz and /metrics there instead
  # of on the API's port (docs/config.md).
  admin_addr: ${CATRACA_ADMIN_ADDR:-}
  # After SIGTERM, keep serving this long while reporting not ready, so load
  # balancers move traffic away first (docs/config.md). 0s when nothing
  # balances in front.
  drain_delay: ${CATRACA_DRAIN_DELAY:-5s}

auth:
  # The send path's token decides and nothing else; reading the audit log,
  # labeling and reloading the rules take the ops token (docs/api.md).
  tokens:
    - name: send-path
      token: ${CATRACA_API_TOKEN}
      scopes: [decide]
    - name: ops
      token: ${CATRACA_OPS_TOKEN}
      scopes: [decide, read, label, admin]

rules:
  # In Kubernetes, point this into a ConfigMap mounted as a directory (not
  # with subPath): each pod reloads the ruleset when the ConfigMap changes.
  path: ${CATRACA_RULES:-rules/default.yaml}
  watch_interval: ${CATRACA_RULES_WATCH_INTERVAL:-5s}

# A rule the ruleset newly enforces, without an override, stays in shadow
# mode until its labels pass the precision gate; warn or off to relax it.
gate:
  on_load: ${CATRACA_GATE_ON_LOAD:-enforce}

store:
  backend: memory

audit:
  dsn: ${CATRACA_AUDIT_DSN:-sqlite:/var/lib/catraca/catraca.db}
  # Delete unlabeled decisions and finished webhook deliveries after this
  # long, so the volume does not fill up; left out, nothing is deleted
  # (docs/audit.md#retention).
  # retention: 2160h

feedback:
  generic:
    secret: ${CATRACA_FEEDBACK_SECRET}

logging:
  level: ${CATRACA_LOG_LEVEL:-info}
  format: json

# Set CATRACA_TRACING=true and OTEL_EXPORTER_OTLP_ENDPOINT to trace
# (docs/tracing.md); the other OTEL_* variables apply too.
tracing:
  enabled: ${CATRACA_TRACING:-false}
